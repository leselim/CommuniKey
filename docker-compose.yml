services:
  db:
    image: postgres:15-alpine
    container_name: ccp_postgres
    environment:
      POSTGRES_DB: community_cloud_db
      POSTGRES_USER: ccp_user
      POSTGRES_PASSWORD: ccp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp_user -d community_cloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccp_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - USE_SQLITE=0
      - DB_HOST=db
      - DB_NAME=community_cloud_db
      - DB_USER=ccp_user
      - DB_PASSWORD=ccp_password
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccp_frontend
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # In Docker the browser talks to the published backend port directly.
      # For plain local dev the CRA proxy keeps everything on one address.
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
